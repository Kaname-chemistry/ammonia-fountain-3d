<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =================================================================
   Geometry constants (cm). Inverted 500 mL round-bottom flask.
   ================================================================= */
const R = 4.92;                         // inner sphere radius → ~500 mL
const NECK_R = 1.2, MOUTH_Y = 26, STOP_TOP = 27.0, STOP_BOT = 23.6;
const JOIN_Y = 30.2;                    // neck meets sphere
const YC = JOIN_Y + Math.sqrt(R * R - NECK_R * NECK_R);
const DOME = YC + R;
const TUBE_TOP = DOME - 3.2, TUBE_RI = 0.21, TUBE_RO = 0.34;
const BK = { y0: 1.2 + 0.22, R: 5.5, H: 12.6 };   // 1000 mL beaker on the stand base
const BK_AREA = Math.PI * BK.R * BK.R;
const TUBE_BOT = BK.y0 + 0.9;
const PIP_X = 0.72, PIP_TOP = STOP_TOP + 1.6;      // dropper pipette through the stopper

// flask inner radius as a function of height (from stopper upward)
function fR(y) { if (y < JOIN_Y) return NECK_R; const d = y - YC; return Math.sqrt(Math.max(0, R * R - d * d)); }
const VT_DY = 0.002, VT = [];
{ let v = 0; for (let y = STOP_TOP; y <= DOME; y += VT_DY) { VT.push(v); const r = fR(y + VT_DY / 2); v += Math.PI * (r * r - (y < TUBE_TOP ? TUBE_RO * TUBE_RO : 0)) * VT_DY; } }
const V_FLASK = VT[VT.length - 1] - Math.PI * 0.16 * 0.16 * (PIP_TOP - STOP_TOP);
function levelFor(v) {
  if (v <= 0) return STOP_TOP;
  let lo = 0, hi = VT.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (VT[m] < v) lo = m; else hi = m; }
  return STOP_TOP + (lo + (v - VT[lo]) / Math.max(1e-9, VT[hi] - VT[lo])) * VT_DY;
}

/* =================================================================
   Physics: gas law + Henry's-law dissolution + hydrostatic drive
   amounts of gas in "mL·atm" (mL at 1 atm, room T)
   ================================================================= */
const P0 = 101.3, RHO_G = 0.0981;       // kPa, kPa per cm of water
const HENRY = 1445;                     // mL NH3 (1 atm) per mL water per atm (≈59 M/atm)
const INJ_ML = 2.0, CQ = 3.1, BK_V0 = 760;
const MIN_AIR = 0.015;                  // a real flask always keeps a little air
const S = {};
function initState() {
  const f = fillFrac();
  Object.assign(S, {
    f, gasNH3: f * (1 - MIN_AIR) * V_FLASK, air: (1 - f * (1 - MIN_AIR)) * V_FLASK, dis: 0,
    liq: 0, drawn: 0, bk: BK_V0, z: 0, injected: false, injT: 0, running: false, done: false, stalled: false,
    Q: 0, P: P0, drive: 0, t: 0, belowLogged: false, runT: 0, peakQ: 0, pinkMix: 0, indMass: 0, minP: P0,
    hist: [], histT: 0, ind: indicatorOn, squeeze: 0
  });
  S.gas0 = S.gasNH3;
}
let indicatorOn = true;
const fillEl = document.getElementById('fill');
const fillFrac = () => { const s = +fillEl.value; return Math.min(1, s * s); };
const vGas = () => Math.max(0.5, V_FLASK - S.liq);
const beakerY = () => BK.y0 + S.bk / BK_AREA;

function physics(dt) {
  S.t += dt;
  const V = vGas();
  // dissolution: relax gas/solution NH3 toward Henry equilibrium; rate set by exposed water
  if (S.liq > 0) {
    const G = S.gasNH3 + S.dis;
    const gEq = G * V / (V + HENRY * S.liq);
    const inj = S.injected ? 900 * Math.exp(-(S.t - S.injT) / 0.7) : 0;
    const area = Math.PI * fR(levelFor(S.liq)) ** 2;
    const K = inj + 75 * S.Q + 5 * area;
    const kr = K * (1 / V + 1 / (HENRY * S.liq));
    S.gasNH3 = gEq + (S.gasNH3 - gEq) * Math.exp(-dt * kr);
    S.dis = G - S.gasNH3;
  }
  S.P = P0 * (S.gasNH3 + S.air) / V;
  S.minP = Math.min(S.minP, S.P);
  const outY = Math.max(TUBE_TOP, levelFor(S.liq));
  const lift = outY - beakerY();
  S.drive = P0 - S.P - RHO_G * lift;
  if (!S.running) {
    // column rises toward hydrostatic equilibrium; it sprays once it reaches the tube top
    const zEq = Math.max(0, (P0 - S.P) / RHO_G);
    const dz = (zEq - S.z) * (1 - Math.exp(-dt * 3.5));
    S.z += Math.max(-40 * dt, Math.min(60 * dt, dz));
    if (S.z >= lift && S.drive > 0 && !S.done) { S.z = lift; S.running = true; S.runT = 0; log('fountain started', true); setState('running'); }
    if (S.injected && !S.done && !S.running && S.t - S.injT > 5 && Math.abs(zEq - S.z) < 0.05) {
      S.done = true; S.stalled = true;
      log(`column stalled ${(lift - S.z).toFixed(1)} cm below the top — too little NH₃`);
      setState('finished');
    }
  } else {
    S.z = lift; S.runT += dt;
    S.Q = S.drive > 0 ? CQ * Math.sqrt(S.drive) : 0;
    const dv = Math.min(S.Q * dt, S.bk - 5, V - 0.8);
    S.liq += dv; S.drawn += dv; S.bk -= dv; S.indMass += S.ind ? dv : 0;
    S.peakQ = Math.max(S.peakQ, S.Q);
    if (S.runT > 0.8 && S.Q < 0.25) {
      S.running = false; S.Q = 0; S.done = true;
      log(`fountain stopped — ${S.drawn.toFixed(0)} mL drawn up, flask ${(100 * S.liq / V_FLASK).toFixed(0)}% full`, true);
      setState('finished');
    }
  }
  if (S.injected && !S.belowLogged && S.P < P0 - 0.5) { S.belowLogged = true; log('pressure dropped below atmospheric'); }
  // pool colour: indicator only arrives with beaker water; NH3 solution is alkaline
  const c = S.liq > 0 ? (S.dis / 24450) / (S.liq / 1000) : 0;
  const pH = c > 1e-7 ? 14 - 0.5 * (4.75 - Math.log10(c)) : 7;
  const target = S.liq > 0 ? (S.indMass / S.liq) * smooth(8.2, 10.2, pH) : 0;
  S.pinkMix += (target - S.pinkMix) * (1 - Math.exp(-dt * 1.3));
  S.pH = pH;
  S.histT += dt;
  if (S.histT > 0.1) { S.histT = 0; S.hist.push(S.P); if (S.hist.length > 400) S.hist.shift(); hudChart = true; }
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function inject() {
  if (S.injected) return;
  S.injected = true; S.injT = S.t; S.liq += INJ_ML; S.squeeze = 0.001;
  for (let i = 0; i < 70; i++) spawn(PIP_X + (Math.random() - 0.5) * 0.1, PIP_TOP + 0.05, 0, (Math.random() - 0.5) * 70, 130 + Math.random() * 160, (Math.random() - 0.5) * 70, false, 0.6);
  log('water injected (2 mL from the dropper)'); setState('dissolving');
  document.getElementById('bInj').disabled = true;
}

/* =================================================================
   Renderer & scene
   ================================================================= */
const isMobile = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const lin = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
const scene = new THREE.Scene();
scene.background = lin(0.79, 0.83, 0.86);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.5, 500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 160; controls.maxPolarAngle = 1.52; controls.minPolarAngle = 0.1;
function frameCamera() {
  const a = innerWidth / innerHeight;
  const dist = a < 1 ? 60 / Math.pow(a, 0.55) : 62;
  controls.target.set(a < 1 ? 2 : 6, a < 1 ? 21 : 21.5, 0);
  camera.position.copy(controls.target).addScaledVector(new THREE.Vector3(0.24, 0.07, 0.97).normalize(), dist);
  controls.update();
}
frameCamera();
scene.add(new THREE.HemisphereLight(0xffffff, 0x7c848b, 0.95));
const sun = new THREE.DirectionalLight(0xfff8ef, 2.3);
sun.position.set(30, 74, 38); sun.target.position.set(0, 10, 0); sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 48, bottom: -36, near: 20, far: 170 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 4;
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0xe6efff, 0.55); fillL.position.set(-38, 28, 22); scene.add(fillL);

/* ---------- helpers ---------- */
const V2 = (x, y) => new THREE.Vector2(x, y);
function tex(w, h, draw, o = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (o.srgb !== false) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  if (o.rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.rep[0], o.rep[1]); }
  return t;
}
function put(geo, mat, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (o.p) m.position.set(...o.p); if (o.r) m.rotation.set(...o.r); if (o.s) m.scale.set(...o.s);
  m.castShadow = !!o.cast; m.receiveShadow = !!o.recv; if (o.ro !== undefined) m.renderOrder = o.ro;
  (o.to || scene).add(m); return m;
}
function glassMat(o = {}) {
  const m = new THREE.MeshPhysicalMaterial({ color: o.color ?? 0xffffff, roughness: 0.03, metalness: 0, ior: 1.5, transparent: true,
    opacity: o.op ?? 0.08, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: o.env ?? 1.7 });
  const k = (o.edge ?? 0.45).toFixed(2);
  m.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      `{ float e = 1.0 - abs(dot(normalize(normal), normalize(vViewPosition))); e = e*e*e;
         diffuseColor.a = clamp(diffuseColor.a + e * ${k}, 0.0, 0.88); outgoingLight += vec3(e * 0.05); }
       #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'af' + k;
  return m;
}
const span = (a, b, n) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n);

/* =================================================================
   Bench, wall
   ================================================================= */
{
  const bm = tex(512, 512, (g, w, h) => {
    g.fillStyle = '#3c4145'; g.fillRect(0, 0, w, h);
    const im = g.getImageData(0, 0, w, h), d = im.data;
    for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 15; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(im, 0, 0);
  }, { rep: [5, 2.5] });
  put(new THREE.BoxGeometry(140, 4, 60), new THREE.MeshStandardMaterial({ map: bm, roughness: 0.95, envMapIntensity: 0.45 }), { p: [2, -2, -4], recv: true });
  const wm = tex(512, 512, (g, w, h) => {
    g.fillStyle = '#c2cad0'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { const v = 231 + ((i * 3 + j * 5) % 8); g.fillStyle = `rgb(${v - 3},${v + 1},${v + 4})`; g.fillRect(i * 128 + 3, j * 128 + 3, 122, 122); }
  }, { rep: [12, 6] });
  put(new THREE.PlaneGeometry(140, 70), new THREE.MeshStandardMaterial({ map: wm, roughness: 0.55, envMapIntensity: 0.6 }), { p: [2, 35, -34], recv: true });
}

/* =================================================================
   Ring stand with a three-finger clamp on the neck
   ================================================================= */
const enamel = new THREE.MeshStandardMaterial({ color: 0x31475d, roughness: 0.45, metalness: 0.1 });
const steel = new THREE.MeshStandardMaterial({ color: 0xc9cdd1, metalness: 1, roughness: 0.28 });
const alu = new THREE.MeshStandardMaterial({ color: 0x8c939a, metalness: 0.8, roughness: 0.45 });
const vinyl = new THREE.MeshStandardMaterial({ color: 0x3b6fb0, roughness: 0.7 });
const ROD = new THREE.Vector3(-11, 0, -2.5);
put(new RoundedBoxGeometry(24, 1.2, 17, 3, 0.4), enamel, { p: [-5, 0.6, -0.5], cast: true, recv: true });
put(new THREE.CylinderGeometry(0.6, 0.6, 58, 20), steel, { p: [ROD.x, 29.6, ROD.z], cast: true });
put(new THREE.CylinderGeometry(0.95, 1.1, 1.2, 20), steel, { p: [ROD.x, 1.8, ROD.z], cast: true });
{
  const CY = (MOUTH_Y + JOIN_Y) / 2 + 0.6;
  put(new RoundedBoxGeometry(2.3, 2.4, 2.3, 2, 0.25), alu, { p: [ROD.x, CY, ROD.z], cast: true });
  put(new THREE.CylinderGeometry(0.22, 0.22, 2.4, 10), steel, { p: [ROD.x, CY, ROD.z + 2], r: [Math.PI / 2, 0, 0] });
  put(new THREE.CylinderGeometry(0.55, 0.55, 0.45, 14), alu, { p: [ROD.x, CY, ROD.z + 3.2], r: [Math.PI / 2, 0, 0], cast: true });

const logEl = $('log');
function log(t, hl) {
  const li = document.createElement('li'); if (hl) li.className = 'hl';
  li.innerHTML = `<span>${S.injected ? (S.t - S.injT).toFixed(1) + ' s' : '—'}</span>${t}`;
  logEl.prepend(li); while (logEl.children.length > 7) logEl.lastChild.remove();
}

/* =================================================================
   Controls
   ================================================================= */
$('bInj').addEventListener('click', inject);
$('bReset').addEventListener('click', () => reset('reset'));
const readFill = () => { $('fv').textContent = `${(100 * fillFrac() * (1 - MIN_AIR)).toFixed(fillFrac() < 0.1 ? 1 : 0)}%`; };
fillEl.addEventListener('input', readFill);
fillEl.addEventListener('change', () => reset(`flask refilled: ${$('fv').textContent} NH₃, rest air`));
$('tInd').addEventListener('click', () => {
  indicatorOn = !indicatorOn; $('tInd').classList.toggle('on', indicatorOn); BK.labelMesh.material.map = BK.labels[indicatorOn ? 1 : 0];
  reset(indicatorOn ? 'phenolphthalein added to the beaker' : 'beaker water without indicator');
});
function reset(msg) {
  initState();
  for (let i = 0; i < NP; i++) { pOn[i] = 0; pA[i] = 0; }
  poolBuilt = -1; logEl.innerHTML = ''; setState('waiting');
  $('bInj').disabled = false;
  log(msg || 'ready'); hudChart = true;
}
function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false);
  pMat.uniforms.uScale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  sizeChart();
}
addEventListener('resize', onResize);

/* =================================================================
   Loop
   ================================================================= */
readFill(); reset('ready: flask of NH₃ at room pressure, column level with the beaker'); onResize();
const clock = new THREE.Clock();
let hudT = 0, paused = false;
function sim(dt) { const n = 3; for (let k = 0; k < n; k++) physics(dt / n); visuals(dt); }
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (!paused) sim(dt);
  controls.update();
  hudT += dt; if (hudT > 0.1) { hudT = 0; updateHud(); }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

// hook for automated checks; has no effect on normal use
window.__nh3 = {
  S, inject, reset,
  setFill(v) { fillEl.value = v; readFill(); fillEl.dispatchEvent(new Event('change')); },
  step(sec, h = 1 / 60) { for (let t = 0; t < sec; t += h) sim(h); updateHud(); renderer.render(scene, camera); },
  hold(on) { renderer.setAnimationLoop(on ? null : frame); if (on) { controls.update(); hudChart = true; updateHud(); renderer.render(scene, camera); } },
  view(t, p) { controls.target.set(...t); camera.position.set(...p); controls.update(); },
  log: () => [...logEl.children].map(l => l.textContent)
};
</script>
</body>
</html>
